name: Build APK

on:
  workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Check for Dart errors
        run: flutter analyze
      - run: flutter create . --project-name morpheus
      - run: flutter pub get
      - run: flutter build apk --debug
      - name: Show compile errors
        if: failure()
        run: flutter build apk --debug 2>&1 | grep -iE "error|exception|failed" | head -40 || true
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: morpheus-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
